version: "3.9"

# ── ProcureLink v2 — Portainer-ready stack ───────────────────────
# Deploy via Portainer > Stacks > Add stack > Upload / paste this file.
# Override secrets via Portainer's "env" tab or a .env file on the host.
#
# Default exposed ports (change via Portainer env overrides):
#   80    → frontend (Nginx + React SPA)
#   2000  → backend API  (direct access / debugging)
#   5555  → Celery Flower
#   8025  → MailHog web UI
#   9001  → MinIO console
#   9090  → Prometheus
#   3001  → Grafana

x-api-env: &api-env
  DATABASE_URL: postgresql://${DB_USER:-proc}:${DB_PASSWORD:-proc}@db:5432/${DB_NAME:-procurelink}
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  SMTP_HOST: mailhog
  SMTP_PORT: 1025
  JWT_SECRET: ${JWT_SECRET:-changeme_in_production_32chars_min}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}

services:
  # ── Frontend (React SPA served by Nginx) ──────────────────────
  frontend:
    build: ./frontend
    container_name: pl_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"
      - "portainer.description=ProcureLink frontend (React + Nginx)"

  # ── Backend API ───────────────────────────────────────────────
  api:
    build: ./backend
    container_name: pl_api
    ports:
      - "${API_PORT:-2000}:2000"
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 2000 --workers 2
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"
      - "portainer.description=ProcureLink FastAPI backend"

  # ── Celery worker ─────────────────────────────────────────────
  worker:
    build: ./backend
    container_name: pl_worker
    environment:
      <<: *api-env
    depends_on:
      - db
      - redis
    command: celery -A app.worker worker --loglevel=info -Q default,emails,pdfs --concurrency=2
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"
      - "portainer.description=ProcureLink Celery worker"

  # ── Celery beat (scheduler) ───────────────────────────────────
  beat:
    build: ./backend
    container_name: pl_beat
    environment:
      <<: *api-env
    depends_on:
      - redis
    command: celery -A app.worker beat --loglevel=info
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"
      - "portainer.description=ProcureLink Celery beat scheduler"

  # ── Flower (Celery monitoring) ────────────────────────────────
  flower:
    build: ./backend
    container_name: pl_flower
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A app.worker flower --port=5555
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"
      - "portainer.description=Celery Flower monitoring"

  db:
    image: postgres:16-alpine
    container_name: pl_db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-procurelink}
      POSTGRES_USER: ${DB_USER:-proc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-proc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-proc} -d ${DB_NAME:-procurelink}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"

  redis:
    image: redis:7-alpine
    container_name: pl_redis
    volumes:
      - redis_data:/data
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"

  minio:
    image: minio/minio
    container_name: pl_minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"

  mailhog:
    image: mailhog/mailhog
    container_name: pl_mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_WEB_PORT:-8025}:8025"
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"

  prometheus:
    image: prom/prometheus:latest
    container_name: pl_prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"

  grafana:
    image: grafana/grafana:latest
    container_name: pl_grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - procurelink_net
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=procurelink"

networks:
  procurelink_net:
    name: procurelink_net
    driver: bridge

volumes:
  postgres_data:

volumes:
  postgres_data: