## ProcureLink v2 — Production compose (pulls from Docker Hub)
##
## Usage:
##   cp .env.example .env        # then fill in real values
##   docker compose -f docker-compose.prod.yml up -d
##
## To pull the latest images and redeploy:
##   docker compose -f docker-compose.prod.yml pull
##   docker compose -f docker-compose.prod.yml up -d

version: "3.9"

x-api-env: &api-env
  DATABASE_URL: postgresql://${DB_USER:-proc}:${DB_PASSWORD:-proc}@db:5432/${DB_NAME:-procurelink}
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-procurelink}
  MINIO_SECURE: "false"
  MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
  SMTP_HOST: ${SMTP_HOST:-mailhog}
  SMTP_PORT: ${SMTP_PORT:-1025}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
  ENVIRONMENT: production
  DEBUG: "false"

services:
  # ── MinIO bucket init (one-shot) ─────────────────────────────
  minio-init:
    image: minio/mc
    container_name: pl_minio_init
    depends_on:
      minio:
        condition: service_healthy
    networks: [procurelink_net]
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
        mc mb --ignore-existing local/${MINIO_BUCKET:-procurelink};
        mc anonymous set download local/${MINIO_BUCKET:-procurelink}/pdfs;
        echo 'MinIO bucket ready';
      "

  # ── Frontend ──────────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USERNAME}/procurelink-frontend:latest
    container_name: pl_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on: [api]
    networks: [procurelink_net]
    restart: unless-stopped

  # ── Backend API ───────────────────────────────────────────────
  api:
    image: ${DOCKERHUB_USERNAME}/procurelink-backend:latest
    container_name: pl_api
    ports:
      - "${API_PORT:-2000}:2000"
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # start.sh runs: alembic upgrade head → uvicorn
    networks: [procurelink_net]
    restart: unless-stopped

  # ── Celery worker ─────────────────────────────────────────────
  worker:
    image: ${DOCKERHUB_USERNAME}/procurelink-backend:latest
    container_name: pl_worker
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: celery -A app.worker worker --loglevel=info -Q default,emails,pdfs --concurrency=2
    networks: [procurelink_net]
    restart: unless-stopped

  # ── Celery beat ───────────────────────────────────────────────
  beat:
    image: ${DOCKERHUB_USERNAME}/procurelink-backend:latest
    container_name: pl_beat
    environment:
      <<: *api-env
    depends_on: [redis]
    command: celery -A app.worker beat --loglevel=info
    networks: [procurelink_net]
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pl_db
    environment:
      POSTGRES_DB: ${DB_NAME:-procurelink}
      POSTGRES_USER: ${DB_USER:-proc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-proc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-proc} -d ${DB_NAME:-procurelink}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [procurelink_net]
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pl_redis
    volumes:
      - redis_data:/data
    networks: [procurelink_net]
    restart: unless-stopped

  # ── MinIO (object storage) ────────────────────────────────────
  minio:
    image: minio/minio
    container_name: pl_minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [procurelink_net]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  procurelink_net:
    driver: bridge
