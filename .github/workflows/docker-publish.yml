name: Build, Push & Deploy

on:
  push:
    branches:
      - main
      - master

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/procurelink-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/procurelink-frontend

jobs:
  build-and-push:
    name: Build & push to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend ────────────────────────────────────────────────
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          platforms: linux/amd64

      # ── Frontend ───────────────────────────────────────────────
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          # VITE_API_URL must be the public Render URL of your backend service.
          # Set RENDER_BACKEND_URL in GitHub → Settings → Secrets → Actions.
          build-args: |
            VITE_API_URL=${{ secrets.RENDER_BACKEND_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # Render redeploys the service by hitting its deploy hook URL.
      # Add each service's deploy hook URL as a repository secret:
      #   RENDER_DEPLOY_HOOK_BACKEND  →  https://api.render.com/deploy/srv-xxx?key=yyy
      #   RENDER_DEPLOY_HOOK_FRONTEND →  https://api.render.com/deploy/srv-zzz?key=www
      #
      # Get the URL from: Render dashboard → your service → Settings → Deploy Hook

      - name: Trigger Render deploy — backend
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Trigger Render deploy — frontend
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"
