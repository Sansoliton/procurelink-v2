name: Build & Push

# Required GitHub secrets:
#   PORTAINER_WEBHOOK_URL — from Portainer → Stacks → <stack> → Enable webhook → copy URL
#
# Optional GitHub secrets / variables:
#   APP_URL              — e.g. https://quotme.sanvx.online
#                          If set, VITE_API_URL is baked as <APP_URL>/api (absolute).
#                          If not set, VITE_API_URL defaults to /api (relative).
#
# Optional GitHub variables (Settings → Variables → Actions):
#   FEATURE_INVOICES     — set to "true" to show Invoices in the sidebar  (default: hidden)
#   FEATURE_PO           — set to "true" to show Purchase Orders in the sidebar (default: hidden)

on:
  push:
    branches: [ main, quotation_planner ]
  workflow_dispatch:

env:
  REGISTRY: registry.sanvx.online
  BACKEND_IMAGE: registry.sanvx.online/procurelink-backend
  FRONTEND_IMAGE: registry.sanvx.online/procurelink-frontend
  NGINX_IMAGE: registry.sanvx.online/procurelink-nginx

jobs:
  # ── Job 1: Build images and push to private registry ──────────────
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push all images
        env:
          REGISTRY: registry.sanvx.online
          GIT_SHA: ${{ github.sha }}
          VITE_API_URL: ${{ secrets.APP_URL && format('{0}/api', secrets.APP_URL) || '/api' }}
          VITE_FEATURE_INVOICES: ${{ vars.FEATURE_INVOICES || 'false' }}
          VITE_FEATURE_PO: ${{ vars.FEATURE_PO || 'false' }}
        run: |
          BACKEND_IMAGE=$REGISTRY/procurelink-backend
          FRONTEND_IMAGE=$REGISTRY/procurelink-frontend
          NGINX_IMAGE=$REGISTRY/procurelink-nginx
          SHORT_SHA=${GIT_SHA::7}

          echo "============================================================"
          echo "  ProcureLink v2 - Build & Push"
          echo "  Registry : $REGISTRY"
          echo "  Git SHA  : $SHORT_SHA"
          echo "============================================================"

          # [1/6] Build backend
          echo "[1/6] Building backend..."
          docker build --platform linux/amd64 \
            -t $BACKEND_IMAGE:latest \
            -t $BACKEND_IMAGE:$SHORT_SHA \
            ./backend
          echo "[OK] Backend built."

          # [2/6] Build frontend
          echo "[2/6] Building frontend..."
          docker build --platform linux/amd64 \
            --build-arg VITE_API_URL=$VITE_API_URL \
            --build-arg VITE_FEATURE_INVOICES=$VITE_FEATURE_INVOICES \
            --build-arg VITE_FEATURE_PO=$VITE_FEATURE_PO \
            -t $FRONTEND_IMAGE:latest \
            -t $FRONTEND_IMAGE:$SHORT_SHA \
            ./frontend
          echo "[OK] Frontend built."

          # [3/6] Build nginx proxy
          echo "[3/6] Building nginx proxy..."
          docker build --platform linux/amd64 \
            -t $NGINX_IMAGE:latest \
            -t $NGINX_IMAGE:$SHORT_SHA \
            ./deployment/nginx
          echo "[OK] Nginx built."

          # [4/6] Push backend
          echo "[4/6] Pushing backend..."
          docker push $BACKEND_IMAGE:latest
          docker push $BACKEND_IMAGE:$SHORT_SHA
          echo "[OK] Backend pushed."

          # [5/6] Push frontend
          echo "[5/6] Pushing frontend..."
          docker push $FRONTEND_IMAGE:latest
          docker push $FRONTEND_IMAGE:$SHORT_SHA
          echo "[OK] Frontend pushed."

          # [6/6] Push nginx proxy
          echo "[6/6] Pushing nginx proxy..."
          docker push $NGINX_IMAGE:latest
          docker push $NGINX_IMAGE:$SHORT_SHA
          echo "[OK] Nginx pushed."

          echo "============================================================"
          echo "  Done! All images pushed to $REGISTRY"
          echo "  Tags: latest and $SHORT_SHA"
          echo "============================================================"

  # ── Job 2: Tell Portainer to pull the new images and redeploy ─────
  deploy:
    name: Redeploy Portainer stack
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Portainer webhook
        run: |
          WEBHOOK="${{ secrets.PORTAINER_WEBHOOK_URL }}"
          if [ -z "$WEBHOOK" ]; then
            echo "⚠️  PORTAINER_WEBHOOK_URL secret not set — skipping redeploy."
            echo "    To enable auto-deploy: Portainer → Stacks → <stack> → Enable webhook → add URL as PORTAINER_WEBHOOK_URL secret."
            exit 0
          fi
          echo "Triggering Portainer redeploy..."
          curl -f -X POST "$WEBHOOK"
          echo "✅ Portainer redeploy triggered."
