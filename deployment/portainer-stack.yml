version: "3.9"

# ProcureLink v2 — Portainer stack
#
# Architecture:
#   nginx (host:PORT) ──┬── /api/* → api:2000   (backend, internal)
#                       └── /*     → frontend:80 (SPA, internal)
#
# Required environment variables (Portainer → Stack → Environment):
#   SECRET_KEY   — JWT secret, minimum 32 characters
#   DB_PASSWORD  — PostgreSQL password
#
# Optional:
#   APP_URL      — public URL, e.g. https://quotme.sanvx.online  (default: http://localhost)
#   PORT         — host port nginx listens on                     (default: 2300)
#   DB_USER      — PostgreSQL username                            (default: proc)
#   DB_NAME      — PostgreSQL database name                       (default: procurelink)

services:

  # ── Nginx reverse proxy (single entry point) ─────────────────
  nginx:
    image: registry.sanvx.online/procurelink-nginx:latest
    container_name: pl_nginx
    pull_policy: always
    ports:
      - "${PORT:-2300}:80"
    depends_on:
      - frontend
      - api
    networks:
      - procurelink_net
    restart: unless-stopped

  # ── React SPA (internal — served through nginx) ───────────────
  frontend:
    image: registry.sanvx.online/procurelink-frontend:latest
    container_name: pl_frontend
    pull_policy: always
    networks:
      - procurelink_net
    restart: unless-stopped

  # ── FastAPI backend (internal — /api/* proxied by nginx) ──────
  api:
    image: registry.sanvx.online/procurelink-backend:latest
    container_name: pl_api
    pull_policy: always
    environment:
      DATABASE_URL:    postgresql://${DB_USER:-proc}:${DB_PASSWORD}@db:5432/${DB_NAME:-procurelink}
      SECRET_KEY:      ${SECRET_KEY}
      ALLOWED_ORIGINS: ${APP_URL:-http://localhost}
      FRONTEND_URL:    ${APP_URL:-http://localhost}
      ENVIRONMENT:     production
      DEBUG:           "false"
      MINIO_ENDPOINT:  ""
    depends_on:
      db:
        condition: service_healthy
    networks:
      - procurelink_net
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pl_db
    environment:
      POSTGRES_DB:       ${DB_NAME:-procurelink}
      POSTGRES_USER:     ${DB_USER:-proc}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-proc} -d ${DB_NAME:-procurelink}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - procurelink_net
    restart: unless-stopped

networks:
  procurelink_net:
    driver: bridge

volumes:
  postgres_data:
