upstream frontend {
    server frontend:80;
}

upstream backend {
    server api:2000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # ── Gzip compression ─────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # ── API → FastAPI backend ─────────────────────────────────────
    # /api/ prefix is stripped before forwarding — backend routes have
    # no /api prefix (e.g. POST /auth/login, not /api/auth/login).
    # X-Forwarded-Proto passes the header set by the upstream SSL
    # terminator (NPM/Cloudflare) so the backend sees "https" not "http".
    location /api/ {
        proxy_pass            http://backend/;
        proxy_http_version    1.1;
        proxy_set_header      Host               $host;
        proxy_set_header      X-Real-IP          $remote_addr;
        proxy_set_header      X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto  $http_x_forwarded_proto;
        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
        proxy_buffering       off;
    }

    # ── React SPA → frontend container ──────────────────────────
    location / {
        proxy_pass          http://frontend/;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
