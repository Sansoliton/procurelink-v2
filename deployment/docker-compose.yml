# ProcureLink v2 — local Docker test stack
#
# Builds all images from source — mirrors the production setup.
# Uses SQLite so no separate DB container is needed.
#
# Usage (run from repo root):
#   docker compose -f deployment/docker-compose.yml up --build
#
# App available at: http://localhost:8080
# API Docs        : http://localhost:8080/api/docs

services:

  # ── Nginx reverse proxy (single entry point) ──────────────────
  nginx:
    build:
      context: ./nginx
    container_name: pl_nginx
    ports:
      - "8080:80"
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - procurelink_net
    restart: unless-stopped

  # ── React SPA ─────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /api
    container_name: pl_frontend
    networks:
      - procurelink_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/nginx.pid || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── FastAPI backend ───────────────────────────────────────────
  api:
    build:
      context: ../backend
    container_name: pl_api
    environment:
      DATABASE_URL:    sqlite:////data/procurelink.db
      SECRET_KEY:      local-dev-secret-key-change-in-prod
      ALLOWED_ORIGINS: http://localhost:8080
      FRONTEND_URL:    http://localhost:8080
      ENVIRONMENT:     production
      DEBUG:           "false"
      MINIO_ENDPOINT:  ""
    volumes:
      - sqlite_data:/data
    networks:
      - procurelink_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:2000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  procurelink_net:
    driver: bridge

volumes:
  sqlite_data:
