version: "3.9"

# ProcureLink v2 — production stack with Nginx reverse proxy
#
# Architecture:
#   nginx (port 80) ─┬─ /api/* → api:2000  (backend, internal)
#                    └─ /*     → frontend:80 (React SPA, internal)
#
# Usage:
#   cp .env.example .env   # fill in SECRET_KEY, DB_PASSWORD
#   docker compose -f deployment/docker-compose.prod.yml up -d
#
# App is available at: http://localhost (port 80)

services:

  # ── Nginx reverse proxy (single entry point) ──────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: pl_nginx
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    networks:
      - procurelink_net
    restart: unless-stopped

  # ── Frontend (internal — served through nginx proxy) ──────────
  frontend:
    image: registry.sanvx.online/procurelink-frontend:latest
    container_name: pl_frontend
    # No external port — only reachable via nginx
    networks:
      - procurelink_net
    restart: unless-stopped

  # ── Backend API (internal — /api/* proxied by nginx) ─────────
  api:
    image: registry.sanvx.online/procurelink-backend:latest
    container_name: pl_api
    # No external port — only reachable via nginx
    environment:
      DATABASE_URL: postgresql://${DB_USER:-proc}:${DB_PASSWORD:-proc}@db:5432/${DB_NAME:-procurelink}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ENVIRONMENT: production
      DEBUG: "false"
      MINIO_ENDPOINT: ""
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 2000 --workers 2
    networks:
      - procurelink_net
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pl_db
    environment:
      POSTGRES_DB: ${DB_NAME:-procurelink}
      POSTGRES_USER: ${DB_USER:-proc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-proc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-proc} -d ${DB_NAME:-procurelink}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - procurelink_net
    restart: unless-stopped

networks:
  procurelink_net:
    driver: bridge

volumes:
  postgres_data:
